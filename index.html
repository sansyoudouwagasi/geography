<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenGeos - 47都道府県マスター スマホ縦置き版</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MURECHO:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['MURECHO', 'Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'MURECHO', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'MURECHO', sans-serif;
            background: linear-gradient(165deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
            background-attachment: fixed;
            user-select: none;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* スマホ専用縦置き枠 ＆ 上下30px余白の配置 */
        .mobile-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            padding-top: 30px;
            padding-bottom: 30px;
            padding-left: 12px;
            padding-right: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Light Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 24px -4px rgba(14, 165, 233, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        }

        /* SVG Map Interactive Styling */
        .pref-path {
            transition: all 0.15s ease-out;
            cursor: pointer;
            stroke-width: 1.5;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .pref-group:active .pref-path,
        .pref-group:hover .pref-path {
            fill: #38bdf8 !important;
            stroke: #0284c7 !important;
            stroke-width: 2.5;
            filter: drop-shadow(0px 4px 10px rgba(56, 189, 248, 0.5));
        }

        .pref-path.correct-flash {
            fill: #10b981 !important;
            stroke: #047857 !important;
            filter: drop-shadow(0px 0px 14px rgba(16, 185, 129, 0.9));
        }

        .pref-path.wrong-flash {
            fill: #f43f5e !important;
            stroke: #be123c !important;
            filter: drop-shadow(0px 0px 14px rgba(244, 63, 94, 0.9));
        }

        .pref-label {
            pointer-events: none;
            font-weight: 800;
            fill: #0f172a;
            text-anchor: middle;
            dominant-baseline: central;
            font-size: 11px;
            text-shadow: 0px 0px 4px rgba(255, 255, 255, 0.95), 0px 0px 6px rgba(255, 255, 255, 0.95);
        }

        #japan-map-svg {
            transition: viewBox 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Custom Mobile Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 4px;
        }

        .badge-locked {
            filter: grayscale(1);
            opacity: 0.45;
        }
    </style>
</head>
<body class="selection:bg-emerald-200">

    <!-- スマホ縦置きディスプレイ可能エリア (上下30px余白配置) -->

        <!-- スマホ上部 ヘッダー＆ステータスバー -->
        <header class="glass-panel p-3 rounded-2xl mb-2.5 shadow-sm">
            <div class="flex items-center justify-between gap-2">
                <!-- App Title & Icon -->
                <div class="flex items-center space-x-2" onclick="switchTab('map')">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-400 to-sky-500 text-white flex items-center justify-center shadow-sm text-base">

                    </div>
                    <div>
                        <h1 class="text-lg font-black font-display bg-gradient-to-r from-emerald-600 to-sky-600 bg-clip-text text-transparent leading-none">

                        <span class="text-[9px] font-extrabold text-slate-400">47都道府県マスター</span>
                    </div>
                </div>

                <!-- Gamification Quick Stats -->

                    </div>

                    <!-- Score & Sound -->

        <!-- MAIN SCREEN CONTENT AREA -->

            <!-- TAB 1: スマホ位置当てテスト (SVG日本地図) -->

                    <!-- Mode Buttons -->

                    <!-- Map Sub Toolbar -->
                    <div class="w-full flex justify-between items-center bg-white/90 px-3 py-1 rounded-xl border border-slate-200 text-[10px] font-bold mb-1 z-10">
                        <button id="toggle-label-btn" onclick="toggleMapLabels()" class="px-2 py-1 rounded-lg bg-slate-100 text-slate-700 flex items-center space-x-1 border border-slate-200">

                        </button>

                        <div class="flex items-center space-x-1">
                            <button onclick="manualZoom(1.25)" class="w-7 h-7 bg-slate-100 text-slate-700 font-black rounded-lg flex items-center justify-center text-xs border border-slate-200">＋</button>
                            <button onclick="manualZoom(0.8)" class="w-7 h-7 bg-slate-100 text-slate-700 font-black rounded-lg flex items-center justify-center text-xs border border-slate-200">－</button>
                            <button onclick="zoomToRegion('ALL')" class="w-7 h-7 bg-slate-100 text-slate-700 font-black rounded-lg flex items-center justify-center text-[10px] border border-slate-200"><i class="fa-solid fa-rotate-left"></i></button>
                        </div>
                    </div>

                    <!-- SVG Japan Vector Map Area (スマホ縦アスペクト比) -->
                    <div class="w-full aspect-[4/5] relative flex items-center justify-center bg-gradient-to-b from-sky-100/60 via-sky-50/40 to-indigo-50/40 rounded-xl border border-sky-100 shadow-inner overflow-hidden">
                        <svg id="japan-map-svg" viewBox="0 0 1000 850" class="w-full h-full drop-shadow-sm touch-pan-x touch-pan-y">
                            <path d="M 680 840 L 680 730 L 780 650 L 980 650" stroke="#64748b" stroke-width="1.5" fill="none" />
                            <text x="695" y="745" fill="#64748b" font-size="12" font-weight="extrabold">沖縄県</text>
                            
                            <g id="map-prefectures">

            <!-- 沖縄県インセット枠 (白地図用) -->
            <g id="okinawa-inset-box">
                <rect x="680" y="610" width="290" height="220" fill="#ffffff" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" rx="10" opacity="0.9" />
                <text x="695" y="632" fill="#64748b" font-size="12" font-weight="bold" font-family="MURECHO">沖縄県 (拡大)</text>
            </g>
</g>
                        </svg>
                    </div>

                    <!-- Toast Info Panel -->
                    <div id="map-info-card" class="mt-1.5 glass-panel px-3 py-2 rounded-xl text-center w-full hidden transition-all">
                        <div id="info-pref-region" class="text-[10px] font-bold text-emerald-600">地方</div>
                        <div id="info-pref-name" class="text-base font-black text-slate-800">都道府県名</div>
                        <div id="info-pref-capital" class="text-xs font-extrabold text-slate-500">県庁所在地: ---</div>
                    </div>
                </div>
            </section>

            <!-- TAB 2: スマホ用4択クイズ -->
            <section id="tab-quiz" class="hidden space-y-3 flex-grow flex flex-col justify-between">
                <div class="glass-panel rounded-2xl shadow-sm border border-white/80 overflow-hidden flex-grow flex flex-col justify-between">
                    
                    <!-- Timer Bar -->
                    <div class="w-full bg-slate-100 h-1.5">
                        <div id="quiz-timer-bar" class="bg-gradient-to-r from-emerald-400 via-sky-400 to-rose-400 h-full w-full"></div>
                    </div>

                    <!-- Question Header -->
                    <div class="px-4 py-2 border-b border-slate-100 flex justify-between items-center bg-white/50">

                    </div>

                        <input type="text" id="book-search" oninput="renderBook()" placeholder="検索 (都道府県名・県庁所在地・特産)..." 
                               class="w-full pl-9 pr-3 py-2 bg-white/90 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
                    </div>

                        <button onclick="filterRegion('北海道')" class="region-filter-btn whitespace-nowrap px-3 py-1 rounded-lg bg-white text-slate-600 border border-slate-200">東北</button>
                        <button onclick="filterRegion('関東')" class="region-filter-btn whitespace-nowrap px-3 py-1 rounded-lg bg-white text-slate-600 border border-slate-200">関東</button>
                        <button onclick="filterRegion('中部')" class="region-filter-btn whitespace-nowrap px-3 py-1 rounded-lg bg-white text-slate-600 border border-slate-200">中部</button>
                        <button onclick="filterRegion('近畿')" class="region-filter-btn whitespace-nowrap px-3 py-1 rounded-lg bg-white text-slate-600 border border-slate-200">近畿</button>

    <!-- DETAIL MODAL -->

    <!-- JAVASCRIPT LOGIC -->
    <script>

        // --- SOUND EFFECTS ---
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'levelup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        // --- LOCAL STORAGE DATA PERSISTENCE ---
        function loadSavedState() {
            try {
                const saved = localStorage.getItem('zengeos_save_v1');
                if (saved) {
                    const data = JSON.parse(saved);
                    score = data.score || 0;
                    level = data.level || 1;
                    exp = data.exp || 0;
                    unlockedPrefs = new Set(data.unlockedPrefs || []);
                    unlockedBadges = new Set(data.unlockedBadges || []);
                    diffCorrectCount = data.diffCorrectCount || 0;
                }
            } catch(e) {}
            updateStatusUI();
        }

        function saveState() {
            try {
                const data = {
                    score,
                    level,
                    exp,
                    unlockedPrefs: Array.from(unlockedPrefs),
                    unlockedBadges: Array.from(unlockedBadges),
                    diffCorrectCount
                };
                localStorage.setItem('zengeos_save_v1', JSON.stringify(data));
            } catch(e) {}
        }

        function updateStatusUI() {
            document.getElementById('score-display').textContent = `${score} pts`;
            document.getElementById('player-level').textContent = `Lv.${level}`;
            
            const expNeeded = level * 100;
            const expPct = Math.min(100, Math.floor((exp / expNeeded) * 100));
            document.getElementById('exp-bar').style.width = `${expPct}%`;

            renderBadges();
        }

        function addExp(pts) {
            score += pts;
            exp += pts;
            const expNeeded = level * 100;
            if (exp >= expNeeded) {
                exp -= expNeeded;
                level++;
                playSound('levelup');
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
                checkAchievement('level_5');
            }
            updateStatusUI();
            saveState();
        }

        function unlockPrefecture(id) {
            if (!unlockedPrefs.has(id)) {
                unlockedPrefs.add(id);
                if (unlockedPrefs.size >= 10) checkAchievement('master_10');
                if (unlockedPrefs.size >= 47) checkAchievement('master_47');
                updateStatusUI();
                saveState();
            }
        }

        function checkAchievement(badgeId) {
            if (!unlockedBadges.has(badgeId)) {
                const def = achievementDefinitions.find(b => b.id === badgeId);
                if (def) {
                    unlockedBadges.add(badgeId);
                    playSound('levelup');
                    confetti({ particleCount: 70, spread: 50, origin: { y: 0.5 } });
                    showMapToast(`🏆 実績！【${def.name}】`, 'bg-amber-500 text-white');
                    updateStatusUI();
                    saveState();
                }
            }
        }

                path.setAttribute('fill', pref.fill);
                path.setAttribute('stroke', pref.stroke);
                path.setAttribute('id', `pref-path-${pref.id}`);
                path.setAttribute('class', 'pref-path shadow-sm');

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

                g.appendChild(path);

        function manualZoom(factor) {
            const svg = document.getElementById('japan-map-svg');
            const newW = currentViewBox.w / factor;
            const newH = currentViewBox.h / factor;

            if (newW < 120 || newW > 1200) return;

            const newX = currentViewBox.x + (currentViewBox.w - newW) / 2;
            const newY = currentViewBox.y + (currentViewBox.h - newH) / 2;

            currentViewBox = { x: newX, y: newY, w: newW, h: newH };
            svg.setAttribute('viewBox', `${newX} ${newY} ${newW} ${newH}`);
        }

        function setupNextQuiz() {
            document.getElementById('quiz-feedback-box').classList.add('hidden');

            const quizType = Math.floor(Math.random() * 4);
            const target = prefectures[Math.floor(Math.random() * prefectures.length)];
            currentQuizPref = target;

            const categoryBadge = document.getElementById('quiz-category-badge');
            const questionText = document.getElementById('quiz-question-text');
            const visualBox = document.getElementById('quiz-visual-box');
            const visualContent = document.getElementById('quiz-visual-content');

            visualBox.classList.add('hidden');

            let options = [target];
            while (options.length < 4) {
                const rand = prefectures[Math.floor(Math.random() * prefectures.length)];
                if (!options.find(o => o.id === rand.id)) options.push(rand);
            }
            options.sort(() => Math.random() - 0.5);

            if (quizType === 0) {
                categoryBadge.textContent = "🏢 県庁所在地クイズ";
                questionText.textContent = `「${target.name}」の県庁所在地はどこ？`;
                renderQuizOptions(options, target, 'capital');
            } else if (quizType === 1) {
                categoryBadge.textContent = "🌾 特産品・地理特徴";
                questionText.textContent = `「${target.goods.split(',')[0]}」などの特産を持つ都道府県は？`;
                visualBox.classList.remove('hidden');
                visualContent.textContent = target.name.charAt(0) + "❓";
                renderQuizOptions(options, target, 'name');
            } else if (quizType === 2) {
                const diffOnly = prefectures.filter(p => p.diff);
                const diffTarget = diffOnly[Math.floor(Math.random() * diffOnly.length)];
                currentQuizPref = diffTarget;
                categoryBadge.textContent = "⚠️ 重要！県名と異なる県庁所在地";
                questionText.textContent = `「${diffTarget.name}」の県庁所在地はどれ？`;
                
                let diffOptions = [diffTarget];
                while(diffOptions.length < 4) {
                    const r = prefectures[Math.floor(Math.random() * prefectures.length)];
                    if(!diffOptions.find(o => o.id === r.id)) diffOptions.push(r);
                }
                diffOptions.sort(() => Math.random() - 0.5);
                renderQuizOptions(diffOptions, diffTarget, 'capital');
            } else {
                categoryBadge.textContent = "🧩 ヒント・地方判定";
                questionText.textContent = `「${target.region}地方」で県庁が「${target.capital}」の都道府県は？`;
                renderQuizOptions(options, target, 'name');
            }

            const timerBar = document.getElementById('quiz-timer-bar');
            timerBar.style.width = '100%';
        }

        function renderQuizOptions(options, target, key) {
            const container = document.getElementById('quiz-options-container');
            container.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3 bg-white/90 active:bg-emerald-50 border border-slate-200 rounded-xl font-extrabold text-slate-800 text-xs text-left transition flex items-center justify-between shadow-xs";
                
                const displayText = key === 'capital' ? opt.capital : opt.name;
                btn.innerHTML = `
                    <span>${displayText}</span>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
                `;

                btn.onclick = () => checkQuizAnswer(opt, target, key);
                container.appendChild(btn);
            });
        }

        function checkQuizAnswer(selected, target, key) {
            const feedbackBox = document.getElementById('quiz-feedback-box');
            const feedbackText = document.getElementById('quiz-feedback-text');

            const isCorrect = selected.id === target.id;

            if (isCorrect) {
                playSound('correct');
                quizStreak++;
                unlockPrefecture(target.id);
                checkAchievement('first_win');

                if (quizStreak >= 5) checkAchievement('streak_5');
                if (quizStreak >= 10) checkAchievement('streak_10');

                if (target.diff) {
                    diffCorrectCount++;
                    if (diffCorrectCount >= 3) checkAchievement('diff_master');
                }

                const pts = 50 + (quizStreak * 10);
                addExp(pts);

                feedbackText.className = "text-xs font-black text-emerald-600";
                feedbackText.innerHTML = `🎉 大正解！ (${target.name} / 県庁: ${target.capital}) +${pts} EXP`;
            } else {
                playSound('wrong');
                quizStreak = 0;
                feedbackText.className = "text-xs font-black text-rose-500";
                const correctAns = key === 'capital' ? target.capital : target.name;
                feedbackText.innerHTML = `❌ 残念... 正解は「${correctAns}」！`;
            }

            document.getElementById('quiz-streak').textContent = `🔥 ${quizStreak}`;
            feedbackBox.classList.remove('hidden');
        }

        function nextQuizQuestion() {
            setupNextQuiz();
        }

        // --- ENCYCLOPEDIA & FILTERING ---
        function filterRegion(region) {
            currentRegionFilter = region;
            document.querySelectorAll('.region-filter-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            if (event && event.target) {
                event.target.classList.remove('bg-white', 'text-slate-600');
                event.target.classList.add('bg-emerald-600', 'text-white');
            }
            renderBook();
        }

        function renderBook() {
            const grid = document.getElementById('book-grid');
            const query = document.getElementById('book-search').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = prefectures.filter(p => {
                const matchesRegion = currentRegionFilter === 'ALL' || p.region.includes(currentRegionFilter);
                const matchesSearch = p.name.includes(query) || p.capital.includes(query) || p.goods.includes(query);
                return matchesRegion && matchesSearch;
            });

            filtered.forEach(p => {
                const isUnlocked = unlockedPrefs.has(p.id);
                const card = document.createElement('div');
                card.className = "glass-panel p-3 rounded-2xl border border-white/90 active:scale-95 transition cursor-pointer flex flex-col justify-between space-y-1.5";
                card.onclick = () => openModal(p);

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-0.5">
                            <span class="text-[9px] font-black px-1.5 py-0.2 rounded bg-sky-100 text-sky-700">${p.region}</span>
                            ${isUnlocked ? '<i class="fa-solid fa-circle-check text-emerald-500 text-xs"></i>' : ''}
                        </div>
                        <h4 class="text-sm font-black text-slate-800">${p.name}</h4>
                        <p class="text-[10px] font-extrabold text-emerald-600">県庁: ${p.capital}</p>
                    </div>
                    <div class="text-[9px] text-slate-500 bg-slate-50 p-1 rounded border border-slate-100 truncate">
                        ${p.goods}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // --- ACHIEVEMENTS RENDERING ---
        function renderBadges() {
            const grid = document.getElementById('badges-grid');
            if (!grid) return;
            grid.innerHTML = '';

            achievementDefinitions.forEach(b => {
                const isUnlocked = unlockedBadges.has(b.id);
                const card = document.createElement('div');
                card.className = `glass-panel p-3 rounded-2xl border text-center flex flex-col items-center justify-between space-y-1 ${isUnlocked ? 'bg-gradient-to-b from-white to-amber-50/60 border-amber-300' : 'badge-locked bg-slate-50'}`;

                card.innerHTML = `
                    <div class="text-2xl">${b.icon}</div>
                    <div>
                        <h4 class="text-xs font-black text-slate-800">${b.name}</h4>
                        <p class="text-[9px] font-bold text-slate-400 leading-tight mt-0.5">${b.desc}</p>
                    </div>
                    <span class="text-[9px] font-black px-2 py-0.5 rounded-full ${isUnlocked ? 'bg-amber-400 text-amber-950' : 'bg-slate-200 text-slate-500'}">
                        ${isUnlocked ? '獲得' : '未達'}
                    </span>
                `;

                grid.appendChild(card);
            });
        }

        // --- MODALS & TAB NAVIGATION ---
        function openModal(pref) {
            document.getElementById('modal-region').textContent = pref.region + "地方";
            document.getElementById('modal-title').textContent = pref.name;
            document.getElementById('modal-capital').textContent = pref.capital;
            document.getElementById('modal-diff').textContent = pref.diff ? "⚠️ 県名と異なる" : "✓ 県名と同じ";
            document.getElementById('modal-goods').textContent = pref.goods;
            document.getElementById('modal-desc').textContent = pref.desc;

            document.getElementById('pref-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('pref-modal').classList.add('hidden');
        }

        function switchTab(tab) {
            document.querySelectorAll('main > section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-700', 'bg-emerald-50', 'border', 'border-emerald-200');
                btn.classList.add('text-slate-500');
            });

            const activeBtn = document.getElementById(`nav-${tab}`);
            activeBtn.classList.remove('text-slate-500');
            activeBtn.classList.add('text-emerald-700', 'bg-emerald-50', 'border', 'border-emerald-200');

            if (tab === 'badges') renderBadges();
        }
    </script>
</body>
</html>
